<!-- assets/logo-orb.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#9EE7FF"></stop>
      <stop offset=".55" stop-color="#58D0FF"></stop>
      <stop offset="1" stop-color="#2A8ED6"></stop>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <!-- núcleo -->
  <circle cx="32" cy="32" r="14" fill="url(#g)" filter="url(#glow)"></circle>
  <!-- anillos -->
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#g)" stroke-width="2" opacity=".85"></ellipse>
  <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="url(#g)" stroke-width="1.2" opacity=".55"></ellipse>
  <!-- destello -->
  <circle cx="24" cy="24" r="4" fill="#fff" opacity=".6"></circle>
</svg>
