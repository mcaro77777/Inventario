<!-- hero-port.svg — Puerto con grúa cargando contenedor (animado) — BARCO MEJORADO -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Carga de contenedor en puerto">
  <defs>
    <!-- Cielo y mar -->
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E9F5FF"></stop>
      <stop offset="1" stop-color="#CFE9FF"></stop>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6AB7FF"></stop>
      <stop offset="1" stop-color="#2E74C9"></stop>
    </linearGradient>

    <!-- Hull / sombreado -->
    <linearGradient id="hullGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset=".8" stop-color="#E6F1FF"></stop>
    </linearGradient>
    <radialGradient id="bowShade" cx="100%" cy="40%" r="80%">
      <stop offset="0" stop-color="rgba(0,0,0,.08)"></stop>
      <stop offset="1" stop-color="rgba(0,0,0,0)"></stop>
    </radialGradient>

    <!-- Contenedores -->
    <linearGradient id="stackBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#29CCFF"></stop>
      <stop offset="1" stop-color="#006FE3"></stop>
    </linearGradient>
    <linearGradient id="stackGreen" x1="0" x2="1">
      <stop offset="0" stop-color="#5BE38C"></stop>
      <stop offset="1" stop-color="#16A856"></stop>
    </linearGradient>
    <linearGradient id="stackOrange" x1="0" x2="1">
      <stop offset="0" stop-color="#FFC04D"></stop>
      <stop offset="1" stop-color="#FF7A00"></stop>
    </linearGradient>

    <!-- Ojo de buey y ondas -->
    <circle id="porthole" r="9" fill="#204A75" stroke="#A6C8F7" stroke-width="3"></circle>
    <path id="wave" d="M0,0 C30,8 50,-8 80,0 S130,8 160,0 S210,-8 240,0" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round"></path>

    <style>
      @media (prefers-reduced-motion: reduce){
        .anim, .steam { animation: none !important; }
        .smil { display: none !important; }
      }
      *{ shape-rendering:geometricPrecision; text-rendering:geometricPrecision; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="360" fill="url(#sky)"></rect>
  <g opacity=".22">
    <rect x="40" y="70" width="80" height="140" fill="#4C86C6"></rect>
    <rect x="120" y="50" width="120" height="160" fill="#6AA1D6"></rect>
    <rect x="250" y="60" width="90" height="150" fill="#4C86C6"></rect>
    <rect x="350" y="40" width="110" height="170" fill="#6AA1D6"></rect>
    <rect x="480" y="65" width="80" height="145" fill="#4C86C6"></rect>
    <rect x="570" y="55" width="120" height="155" fill="#6AA1D6"></rect>
  </g>

  <!-- Mar -->
  <rect y="290" width="800" height="70" fill="url(#sea)"></rect>
  <g transform="translate(0, 308)" opacity=".55">
    <use href="#wave">
      <animateTransform class="smil" attributeName="transform" type="translate" values="0 0; -240 0" dur="6s" repeatCount="indefinite"></animateTransform>
    </use>
    <use href="#wave" transform="translate(240,8)">
      <animateTransform class="smil" attributeName="transform" type="translate" values="240 8; 0 8" dur="5.5s" repeatCount="indefinite"></animateTransform>
    </use>
    <use href="#wave" transform="translate(120,16)" opacity=".65">
      <animateTransform class="smil" attributeName="transform" type="translate" values="120 16; -120 16" dur="7s" repeatCount="indefinite"></animateTransform>
    </use>
  </g>

  <!-- Muelle -->
  <rect x="0" y="260" width="340" height="12" fill="#2F3E52" opacity=".75"></rect>
  <rect x="0" y="272" width="340" height="18" fill="#1E2A38" opacity=".85"></rect>

  <!-- GRÚA pórtico -->
  <g transform="translate(310,70)">
    <rect x="0" y="30" width="18" height="200" rx="2" fill="#E23D2A"></rect>
    <rect x="0" y="30" width="18" height="36" fill="#C52E1E"></rect>
    <rect x="-12" y="228" width="60" height="14" fill="#D53927"></rect>
    <rect x="0" y="30" width="280" height="10" rx="2" fill="#F04B37"></rect>
    <rect x="0" y="40" width="280" height="6" fill="#C52E1E"></rect>

    <!-- Trolley + izaje -->
    <g id="trolley" class="anim">
      <g>
        <rect x="20" y="18" width="40" height="16" rx="3" fill="#203A63" stroke="#91BDF4" stroke-width="2"></rect>
        <rect x="30" y="34" width="20" height="6" fill="#203A63"></rect>
      </g>
      <rect x="39" y="40" width="2" height="70" fill="#203A63"></rect>
      <rect x="59" y="40" width="2" height="70" fill="#203A63"></rect>
      <rect x="46" y="108" width="8" height="8" rx="2" fill="#203A63"></rect>
      <g id="box" transform="translate(28,116)">
        <rect width="44" height="26" rx="2" fill="url(#stackOrange)" stroke="#F5C48A" stroke-width="2"></rect>
        <rect x="4" y="6" width="36" height="6" fill="rgba(255,255,255,.25)"></rect>
        <animateTransform class="smil" attributeName="transform" type="translate" values="28,116; 28,140; 28,96; 28,96; 28,116" keyTimes="0; .14; .33; .66; 1" dur="6s" repeatCount="indefinite"></animateTransform>
      </g>
      <animateTransform class="smil" attributeName="transform" type="translate" values="0 0; 190 0; 190 0; 0 0" keyTimes="0; .33; .66; 1" dur="6s" repeatCount="indefinite"></animateTransform>
    </g>
  </g>

  <!-- Pilas de contenedores en muelle -->
  <g transform="translate(40,228)">
    <rect x="0" y="20" width="70" height="36" rx="3" fill="url(#stackBlue)"></rect>
    <rect x="72" y="20" width="70" height="36" rx="3" fill="url(#stackGreen)"></rect>
    <rect x="144" y="20" width="70" height="36" rx="3" fill="url(#stackOrange)"></rect>
    <rect x="36" y="-18" width="70" height="36" rx="3" fill="url(#stackGreen)"></rect>
    <rect x="108" y="-18" width="70" height="36" rx="3" fill="url(#stackBlue)"></rect>
  </g>

  <!-- ======== BARCO mejorado (con leve vaivén) ======== -->
  <g transform="translate(420,230)" class="anim">
    <!-- Vaivén suave -->
    <animateTransform class="smil" attributeName="transform" type="translate" values="420,230; 420,229; 420,230" dur="4s" repeatCount="indefinite"></animateTransform>

    <!-- Hull (casco) con proa curvada y bulbo -->
    <!-- Trazo superior de borda para silueta definida -->
    <path d="M20,22
             L300,22
             C320,22 335,18 350,14
             C420,-4 470,0 510,24
             L475,74
             L60,74
             C36,74 22,66 16,58
             L10,46
             C16,32 18,26 20,22 Z" fill="url(#hullGrad)" stroke="#8FB7E6" stroke-width="2"></path>

    <!-- Sombreado en la proa para volumen -->
    <path d="M350,14 C420,-4 470,0 510,24 L490,60 L420,60 C420,30 380,24 350,24 Z" fill="url(#bowShade)" opacity=".6"></path>

    <!-- Bulbo de proa (línea oscura bajo flotación) -->
    <path d="M470,70
             C468,64 474,60 482,58
             C490,56 498,56 505,60
             L502,66
             C496,64 488,64 482,66
             C477,67 474,68 470,70 Z" fill="#234a72" opacity=".9"></path>

    <!-- Línea de flotación roja (boot-top) -->
    <path d="M60,74 L475,74" stroke="#FF6B6B" stroke-width="6"></path>

    <!-- Borda/railing fina para que se distinga el contorno superior -->
    <path d="M20,22 L300,22 C320,22 335,18 350,14" stroke="#9EBFEA" stroke-width="2" fill="none"></path>

    <!-- Superestructura (puente) de dos niveles -->
    <g transform="translate(260,-16)">
      <!-- Nivel inferior -->
      <rect x="0" y="0" width="112" height="24" rx="3" fill="#FFFFFF" stroke="#8FB7E6" stroke-width="2"></rect>
      <!-- Ventanas -->
      <g fill="#2A5C8E">
        <rect x="6" y="6" width="12" height="8" rx="1"></rect>
        <rect x="22" y="6" width="12" height="8" rx="1"></rect>
        <rect x="38" y="6" width="12" height="8" rx="1"></rect>
        <rect x="54" y="6" width="12" height="8" rx="1"></rect>
        <rect x="70" y="6" width="12" height="8" rx="1"></rect>
        <rect x="86" y="6" width="12" height="8" rx="1"></rect>
      </g>

      <!-- Nivel superior / puente de mando -->
      <rect x="20" y="-26" width="74" height="22" rx="3" fill="#FFFFFF" stroke="#8FB7E6" stroke-width="2"></rect>
      <g fill="#2A5C8E">
        <rect x="26" y="-20" width="14" height="8" rx="1"></rect>
        <rect x="44" y="-20" width="14" height="8" rx="1"></rect>
        <rect x="62" y="-20" width="14" height="8" rx="1"></rect>
      </g>
      <!-- Radar/mástil -->
      <rect x="56" y="-36" width="4" height="10" fill="#203A63"></rect>
      <rect x="46" y="-40" width="24" height="4" rx="2" fill="#203A63"></rect>

      <!-- Chimenea y humo -->
      <rect x="96" y="-34" width="16" height="22" fill="#203A63" rx="2"></rect>
      <g class="steam" opacity=".5">
        <circle cx="104" cy="-44" r="6" fill="#FFFFFF">
          <animate attributeName="cy" values="-44;-64" dur="2.2s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"></animate>
          <animate attributeName="r" values="6;10" dur="2.2s" repeatCount="indefinite"></animate>
        </circle>
        <circle cx="114" cy="-48" r="4" fill="#FFFFFF">
          <animate attributeName="cy" values="-48;-70" dur="2.1s" begin=".7s" repeatCount="indefinite"></animate>
          <animate attributeName="opacity" values="0.7;0" dur="2.1s" begin=".7s" repeatCount="indefinite"></animate>
          <animate attributeName="r" values="4;9" dur="2.1s" begin=".7s" repeatCount="indefinite"></animate>
        </circle>
      </g>
    </g>

    <!-- Ojos de buey en el casco -->
    <g transform="translate(86,50)">
      <use href="#porthole"></use><use href="#porthole" x="42"></use><use href="#porthole" x="84"></use><use href="#porthole" x="126"></use>
    </g>

    <!-- Estela en popa (wavelet) -->
    <path d="M55,78 q18,6 36,0 q18,-6 36,0 q18,6 36,0" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".7">
      <animate attributeName="d" dur="2.8s" repeatCount="indefinite" values="M55,78 q18,6 36,0 q18,-6 36,0 q18,6 36,0;
                M55,78 q18,4 36,0 q18,-4 36,0 q18,4 36,0;
                M55,78 q18,6 36,0 q18,-6 36,0 q18,6 36,0"></animate>
    </path>

    <!-- Ancla simple en la proa para lectura -->
    <g transform="translate(452,46)" fill="none" stroke="#234a72" stroke-width="2">
      <circle cx="0" cy="0" r="3" fill="#234a72"></circle>
      <path d="M0,0 v10 M-6,8 a8 8 0 0 0 12,0"></path>
    </g>
  </g>

</svg>
