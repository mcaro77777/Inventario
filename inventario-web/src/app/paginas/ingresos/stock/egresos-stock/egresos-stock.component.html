<form [formGroup]="formulario" (ngSubmit)="onSubmit()">
  <p-progressBar *ngIf="saving" mode="indeterminate" style="height: 4px; margin: 0 0 .75rem 0;"></p-progressBar>

  <div class="ingreso-form-grid">
    <!-- Panel: Datos de la Solicitud -->
    <div class="ingreso-row">
      <div class="ingreso-panel" style="width: 100%;">
        <div class="p-panel-header">Datos de la Solicitud</div>
        <div class="p-panel-content">
          <div class="misat-flex-row-wrap">
            <!-- Producto -->
            <div class="form-field" style="flex: 1; min-width: 280px;">
              <label class="form-label">Producto <span class="required">*</span></label>
              <p-select [options]="productos" optionLabel="nombre" optionValue="id" 
                placeholder="Seleccione producto" filter="true" showClear="true" 
                formControlName="producto" styleClass="form-control-select"></p-select>
            </div>
            <!-- Cliente -->
            <div class="form-field" style="flex: 1; min-width: 280px;">
              <label class="form-label">Cliente <span class="required">*</span></label>
              <p-select [options]="clientes" optionLabel="nombre" optionValue="id" 
                placeholder="Seleccione cliente" filter="true" showClear="true" 
                formControlName="cliente" styleClass="form-control-select"></p-select>
            </div>
          </div>
          <div class="misat-flex-row-wrap" style="margin-top: 12px;">
            <!-- Fecha -->
            <div class="form-field" style="flex: 0 0 180px;">
              <label class="form-label">Fecha <span class="required">*</span></label>
              <p-datepicker showIcon="true" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa" 
                formControlName="fecha" styleClass="form-control-date"></p-datepicker>
            </div>
            <!-- Cantidad -->
            <div class="form-field" style="flex: 0 0 140px;">
              <label class="form-label">Cantidad <span class="required">*</span></label>
              <input pInputText type="number" formControlName="cantidad" placeholder="0" class="form-control" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer con botones -->
  <div class="dialog-footer-buttons">
    <button pButton type="button" label="Cancelar" class="btn-secondary" [disabled]="saving" (click)="cerrarDialogo()"></button>
    <button pButton type="button" label="Guardar" icon="pi pi-save" iconPos="right" class="btn-accent" [disabled]="saving" (click)="confirmarGuardar()"></button>
  </div>
</form>

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
