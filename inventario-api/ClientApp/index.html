  <body>
    <!-- ============================================================
      BOOT rápido:
      - Solo día/noche (sin modo sistema). Lee localStorage('theme') o usa 'light'.
      - Heurística de rendimiento (perf-lite) según hardware.
    ============================================================ -->
    <script>
      (function () {
        try {
          // 1) Tema (sin modo sistema)
          var saved = localStorage.getItem('theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.body.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');

          // 2) Acento persistido (blue|green). Default blue.
          var acc = localStorage.getItem('accent');
          document.body.classList.add(acc === 'green' ? 'accent-green' : 'accent-blue');

          // 3) perf-lite si hardware modesto (menos blur/sombras)
          var lowPerf =
            (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
            (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
          if (lowPerf) document.body.classList.add('perf-lite');
        } catch (e) {
          document.body.classList.add('light-theme', 'accent-blue');
        }
      })();
    </script>
