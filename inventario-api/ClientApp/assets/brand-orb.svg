<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Marca Agrícola Lo Beltrán</title>
  <desc>Orbe futurista con halo y puntos orbitales</desc>

  <!-- Halo suave -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity=".45"></stop>
      <stop offset="55%" stop-color="#79c0ff" stop-opacity=".18"></stop>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e0ff"></stop>
      <stop offset="55%" stop-color="#6ab8ff"></stop>
      <stop offset="100%" stop-color="#67a3ff"></stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#halo)"></circle>
  <circle cx="32" cy="32" r="18" fill="url(#orb)" stroke="#9fd8ff" stroke-opacity=".45"></circle>

  <!-- brillo -->
  <ellipse cx="26" cy="23" rx="10" ry="6" fill="url(#sheen)" opacity=".55"></ellipse>

  <!-- anillo -->
  <ellipse cx="32" cy="32" rx="20" ry="10" fill="none" stroke="#7dc6ff" stroke-opacity=".35" stroke-width="2"></ellipse>

  <!-- puntos orbitales -->
  <g fill="#d8f0ff" opacity=".95">
    <circle cx="18" cy="31" r="1.6"></circle>
    <circle cx="46" cy="31" r="1.6"></circle>
    <circle cx="32" cy="20" r="1.6"></circle>
    <circle cx="32" cy="44" r="1.6"></circle>
  </g>
</svg>
